apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-2
  namespace: devtroncd-ent-3            # <- this is what lands in the RBAC object
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps
    path: guestbook
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc   # special-cased to "same cluster as the CR"
    namespace: wl-argo-2                        # own namespace, so resource ownership is testable
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
