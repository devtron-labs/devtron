apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-1
  namespace: devtroncd-ent-3            # <- this is what lands in the RBAC object
spec:
  interval: 10m
  prune: true
  targetNamespace: wl-flux-1    # without this, podinfo deploys INTO devtroncd-ent-3
  sourceRef:
    kind: GitRepository
    name: podinfo
  path: ./kustomize
