# Workload namespaces for the fixtures.
#
# These are where the apps DEPLOY TO. They are not part of the RBAC object —
# that uses the namespace the Application / Kustomization CR itself lives in
# (devtroncd-ent-3, devtroncd-oss-2).
#
# Each app gets its own workload namespace so that "access to app A must not
# grant access to app B's pods" is actually testable. Sharing one namespace
# would make every resource legitimately belong to every app's resource tree.
#
# Argo creates its own destinations via CreateNamespace=true, but Flux does not
# create targetNamespace, so they are declared here for both.
apiVersion: v1
kind: Namespace
metadata: { name: wl-argo-1, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-argo-2, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-argo-3, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-argo-4, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-flux-1, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-flux-2, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-flux-3, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-flux-4, labels: { rbac-test: "true" } }
---
apiVersion: v1
kind: Namespace
metadata: { name: wl-flux-5, labels: { rbac-test: "true" } }
